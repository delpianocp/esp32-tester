{% extends "base.html" %}
{% block title %}Crear cuenta{% endblock %}

{% block content %}
<h1>Crear cuenta</h1>
<div class="card" style="max-width:420px;">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Crear cuenta</button>
    </form>
    <p class="helptext" style="margin-top:14px;">
        ¿Ya tenés cuenta? <a href="{% url 'login' %}">Ingresá acá</a>
    </p>
</div>
{% endblock %}
