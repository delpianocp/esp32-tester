{% extends "base.html" %}
{% block title %}Ingresar — Lumbre{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:55vh;">
<div class="border border-secondary-subtle rounded p-4 text-center" style="max-width: 380px; width:100%;">
    <i class="bi bi-broadcast fs-1 text-info mb-2 d-block"></i>
    <h1 class="h4 text-light mb-1">Ingresar a Lumbre</h1>
    <p class="text-secondary small mb-4">Iniciá sesión con tu cuenta de Google para ver y controlar tus dispositivos.</p>

    <a href="{% url 'social:begin' 'google-oauth2' %}" class="btn btn-outline-info w-100 d-flex align-items-center justify-content-center gap-2 py-2">
        <i class="bi bi-google"></i>
        Continuar con Google
    </a>
</div>
</div>
{% endblock %}
